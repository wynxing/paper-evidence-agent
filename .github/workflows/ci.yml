name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The lockfile already pins runtime, test, and build dependencies.
      # --no-deps --no-build-isolation matches the local editable install.
      - name: Install backend
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e backend

      # Contract checks run node frontend/scripts/inspect-contracts.mjs, which
      # imports typescript from this install. They fail, rather than skip, without it.
      # npm ci reports one high-severity advisory in the locked tree; do not bump versions to clear it.
      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # docs/semantic-report.md 由 tests/functional/report.py 生成：正文里每个计数都从同一份
      # metrics 派生，且不含随 commit 变化的字段，所以可以「重新生成并逐字节比对」。
      # 放在 pytest 之前：报告漂移是一步就能修的机械错误（跑一次 `python report.py` 并提交），
      # 先失败能省掉一轮 pytest。这是既有 `backend` 作业里的一步，**不新增检查项**。
      - name: Check the semantic report matches the frozen samples
        run: python tests/functional/report.py --check

      # 24 条金标的「第二人签核」与 4 个冻结来源的清单一致性，此前只在手工执行记录里查过，
      # 也就是说：有人把一条签核改成 disputed、或把冻结清单改了而不更新哈希，CI 仍然全绿。
      # 两道都是离线检查（不联网、各 < 5 s），放在 pytest 之前，理由同上：这类漂移一步就能修。
      # 这是既有 `backend` 作业里新增的两步，**不新增检查项**（与 backend/frontend/e2e 三个
      # 作业的关系不变）；若团队更希望它像 e2e 那样独立成项（#26 的做法），拆出去也可以。
      #
      # 口径边界：离线模式下 19 条引文落在清单预览窗口之外，只能记「无法判定」。所以这道门禁
      # 证明的是「签核状态没漂、冻结清单没漂」，**不是引文验收**；引文真核仍归
      # `claims.py --live`（需外网，CI 不跑，见 docs/execution-record.md §4）。
      - name: Check the answer key is still signed off
        run: python tests/functional/claims.py --require-coverage --require-review

      - name: Check the frozen sources still match the manifest
        run: python tests/functional/freeze_sources.py --check

      - name: Run pytest
        run: python -m pytest -c backend/pyproject.toml -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci reports one high-severity advisory in the locked tree; do not bump versions to clear it.
      - name: Install dependencies
        run: npm --prefix frontend ci

      # Node's built-in runner (frontend/package.json "test"). This job used to only build because that script did not exist yet.
      # The job id and name stay `frontend`; this step does not add a third check.
      - name: Test
        run: npm --prefix frontend test

      - name: Build
        run: npm --prefix frontend run build

  # 界面主路径（tests/e2e，Playwright）。按 #26 的决定：作为**独立检查项**先跑，
  # 暂不设为合并必须通过，跑稳一段时间后再考虑转为必需。
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json

      - name: Install backend
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e backend

      # 用例会起真前端 dev server（playwright.config.ts 的第四个 webServer），所以前端依赖也要装。
      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # Playwright 依赖由 tests/e2e 自持，不并入 frontend（#26 的决定）。
      - name: Install end-to-end dependencies
        run: cd tests/e2e && npm ci

      - name: Install Chromium
        run: cd tests/e2e && npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: cd tests/e2e && npm test
        env:
          # 配置默认按 backend/.venv 找解释器；CI 用 setup-python 装在 PATH 上的那个。
          PAPER_EVIDENCE_E2E_PYTHON: python

      # 一轮运行的产物都在 .run/ 下：轨迹（trace: 'retain-on-failure'）、HTML 报告、
      # 以及常驻 worker 自己写的那份 worker-<runId>.log。不传上去等于失败只剩一个
      # 「排队中」。include-hidden-files 是必需的：.run/ 是隐藏目录，upload-artifact
      # 默认跳过隐藏文件，实测不加这个开关会报 "No files were found with the provided
      # path"（首次运行就是这样，什么都没传上来）。if-no-files-found 用 warn 而不是
      # ignore：真收不到产物时至少留一条告警，不会静默跳过。
      - name: Upload run artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-run
          path: tests/e2e/.run/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
