name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The lockfile already pins runtime, test, and build dependencies.
      # --no-deps --no-build-isolation matches the local editable install.
      - name: Install backend
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e backend

      # Contract checks run node frontend/scripts/inspect-contracts.mjs, which
      # imports typescript from this install. They fail, rather than skip, without it.
      # npm ci reports one high-severity advisory in the locked tree; do not bump versions to clear it.
      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run pytest
        run: python -m pytest -c backend/pyproject.toml -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci reports one high-severity advisory in the locked tree; do not bump versions to clear it.
      - name: Install dependencies
        run: npm --prefix frontend ci

      # Node's built-in runner (frontend/package.json "test"). This job used to only build because that script did not exist yet.
      # The job id and name stay `frontend`; this step does not add a third check.
      - name: Test
        run: npm --prefix frontend test

      - name: Build
        run: npm --prefix frontend run build

  # 界面主路径（tests/e2e，Playwright）。按 #26 的决定：作为**独立检查项**先跑，
  # 暂不设为合并必须通过，跑稳一段时间后再考虑转为必需。
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json

      - name: Install backend
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e backend

      # 用例会起真前端 dev server（playwright.config.ts 的第四个 webServer），所以前端依赖也要装。
      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # Playwright 依赖由 tests/e2e 自持，不并入 frontend（#26 的决定）。
      - name: Install end-to-end dependencies
        run: cd tests/e2e && npm ci

      - name: Install Chromium
        run: cd tests/e2e && npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: cd tests/e2e && npm test
        env:
          # 配置默认按 backend/.venv 找解释器；CI 用 setup-python 装在 PATH 上的那个。
          PAPER_EVIDENCE_E2E_PYTHON: python

      # 轨迹由 trace: 'retain-on-failure' 写在 .run/results-*/ 下；不传上去等于失败无法定位。
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: tests/e2e/.run/results-*
          if-no-files-found: ignore
          retention-days: 7
